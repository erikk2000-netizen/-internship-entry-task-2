services:
    db:
        image: mysql:8.0
        container_name: mysql_db
        restart: always
        environment:
            MYSQL_DATABASE: candidate_data
            MYSQL_USER: user
            MYSQL_PASSWORD: password
            MYSQL_ROOT_PASSWORD: rootpassword
        ports:
            - "3306:3306"
        volumes:
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql
            - candidate-data:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: phpmyadmin
        restart: always
        ports:
            - "8088:80"
        environment:
            PMA_HOST: db
            MYSQL_ROOT_PASSWORD: rootpassword
        depends_on:
            - db

    candidate-service:
        build: .
        environment:
            PROVIDER_URL: http://provider-simulator:8081
            DATABASE_URL: mysql+pymysql://user:password@db:3306/candidate_data
        ports:
            - "8080:8080"
        depends_on:
            - db

    provider-simulator:
        image: ghcr.io/fintech-dev-lab/internship-provider-simulator:v0.2.0
        environment:
            CALLBACK_URL: http://candidate-service:8080/receipts
        ports:
            - "8081:8081"
        depends_on:
            - candidate-service

volumes:
    candidate-data:
